<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrace rezervací</title><style>body{font:16px system-ui,sans-serif;max-width:760px;margin:50px auto;padding:0 20px;color:#233d35;background:#f6f4ed}main{background:#fffefa;border:1px solid #e8e7dd;border-radius:20px;padding:28px}input,button{font:inherit;padding:11px 13px;border-radius:10px;border:1px solid #ccd8ce}button{background:#233d35;color:white;cursor:pointer}form{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.hidden{display:none}.day{display:flex;justify-content:space-between;align-items:center;padding:12px;border-top:1px solid #e8e7dd}.error{color:#a64c37}</style></head><body><main><h1>Administrace rezervací</h1><section id="login"><p>Přihlášení správce</p><form id="loginForm"><input id="password" type="password" placeholder="Heslo" required><button>Přihlásit</button></form><p class="error" id="loginError"></p></section><section id="panel" class="hidden"><p>Blokované termíny se uloží na server do Netlify Blobs.</p><form id="blockForm"><input id="date" type="date" required><button>Blokovat termín</button></form><div id="days"></div><p class="error" id="panelError"></p></section></main><script>const login=document.querySelector('#login'),panel=document.querySelector('#panel'),days=document.querySelector('#days'),error=document.querySelector('#loginError'),panelError=document.querySelector('#panelError');async function load(){const r=await fetch('/api/admin');if(!r.ok){login.classList.remove('hidden');panel.classList.add('hidden');return}const d=await r.json();login.classList.add('hidden');panel.classList.remove('hidden');days.innerHTML=d.blocked.length?d.blocked.sort().map(x=>`<div class="day"><span>${x}</span><button data-date="${x}">Odblokovat</button></div>`).join(''):'<p>Žádné blokované termíny.</p>'}document.querySelector('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});if(r.ok){error.textContent='';load()}else error.textContent='Neplatné heslo.'});document.querySelector('#blockForm').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/admin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'block',date:document.querySelector('#date').value})});if(!r.ok){panelError.textContent='Termín se nepodařilo uložit.';return}panelError.textContent='';e.target.reset();load()});days.addEventListener('click',async e=>{if(!e.target.dataset.date)return;await fetch('/api/admin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'unblock',date:e.target.dataset.date})});load()});load();</script></body></html>
